[package]
name = "vdb_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.8"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3.3"
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
rustc-hash = "2.1.3"
rayon = "1.12.0"
parking_lot = { version = "0.12.5", features = ["serde"] }
uuid = { version = "1.23.4", features = ["v4"] }
pdf-extract = "0.12.0"
calamine = "0.36.0"
zip = "8.6.0"
quick-xml = "0.41.0"
